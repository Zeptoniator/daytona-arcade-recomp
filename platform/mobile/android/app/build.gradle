plugins {
    id 'com.android.application'
}

// The ROM set this APK is built from (-Pm2Romset=daytona for Revision A);
// its generated code is where scripts/setup.py puts it: build/gen for
// daytona93, build-<set>/gen for the others. -Pm2GenRoot overrides that.
def m2Romset = providers.gradleProperty('m2Romset').getOrElse('daytona93')
def m2GenRoot = providers.gradleProperty('m2GenRoot').getOrElse(
        "${rootProject.projectDir}/../../../" + (m2Romset == 'daytona93' ? 'build' : "build-${m2Romset}") + '/gen')

android {
    namespace 'com.boucydesigns.daytona'
    compileSdk 37
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.boucydesigns.daytona'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1'

        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release',
                          "-DM2_ROMSET=${m2Romset}",
                          "-DM2_GEN_ROOT=${m2GenRoot}"
                targets 'daytona'
                cppFlags '-std=c++20'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // SDLActivity and its helper classes come from the pinned SDL source
            // fetched by scripts/setup.py.
            java.srcDirs = [
                'src/main/java',
                '../../../../extern/sdl3/android-project/app/src/main/java'
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../../../CMakeLists.txt')
            version '3.31.6'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
